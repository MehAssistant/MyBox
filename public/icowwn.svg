      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#boxGrad)" />
  
  <!-- Box Base Body -->
  <path d="M120 230 L392 230 L372 410 C370 422 360 432 348 432 L164 432 C152 432 142 422 140 410 Z" fill="#3730A3" opacity="0.35"/>
  <path d="M130 220 L382 220 L364 396 C362 406 354 414 344 414 L168 414 C158 414 150 406 148 396 Z" fill="#FFFFFF" opacity="0.95"/>
  
