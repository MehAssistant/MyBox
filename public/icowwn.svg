  <!-- Ribbon Vertical -->
  <rect x="236" y="176" width="40" height="238" fill="#F59E0B" />
  
  <!-- Ribbon Knot / Bow -->
  <path d="M210 145 C180 110 210 90 240 135 C246 144 252 155 256 168 C260 155 266 144 272 135 C302 90 332 110 302 145 C286 164 268 174 256 178 C244 174 226 164 210 145 Z" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
  <circle cx="256" cy="172" r="14" fill="#D97706" />

  <!-- Money / Sparkle badge symbol inside box -->
  <circle cx="256" cy="300" r="38" fill="#10B981" />
  <text x="256" y="314" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Rp</text>
